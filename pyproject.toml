[project]
name = "zipcator"
version = "0.1.0"
description = "Find every US ZIP code (Census ZCTA) that overlaps a radius around an address."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FloridaMenConsulting" }]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "pyarrow>=15",
    "pandas>=2.2",
    "requests>=2.31",
    "streamlit>=1.40",
    "folium>=0.17",
    "streamlit-folium>=0.22",
]

[project.scripts]
zipcator = "zipcator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "responses>=0.25",
    "geographiclib>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-requests>=2.31",
]
visual = [
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zipcator"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not data and not network and not slow and not visual'"
markers = [
    "data: needs the built data artifact (data/zcta.parquet)",
    "network: calls real external APIs (Census, Nominatim)",
    "slow: performance benchmarks",
    "visual: launches the Streamlit app and captures screenshots with Playwright",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["zipcator"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == .__main__.:', "if TYPE_CHECKING:"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["zipcator"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
